name: json_list_generic
description: Demo how to parse `JSON` to a generic list `List<T>` with `T` is the model class you defined (use `json_annotation` library).
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  json_annotation: ^4.9.0
  json_serializable: ^6.11.0

dev_dependencies:
  analyzer: ^9.0.0
  lints: ^5.0.0
  test: ^1.28.0
  build_runner: ^2.10.0
